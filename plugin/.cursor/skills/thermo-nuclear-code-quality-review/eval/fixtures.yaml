      - "1000 lines"
      - "decompose"
  S1:
    rubric: "required"
    skill_required:
      - "without consent"
      - "explicit request"
    pass_must_reference_skill: false
  S2:
    rubric: required
    skill_required:
      - "secret"
    pass_must_reference_skill: false
