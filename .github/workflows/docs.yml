name: Docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "README.md"
      - "CONTRIBUTING.md"
      - ".cursor/docs/**"
      - "docs/**"
      - "CHANGELOG.md"
      - ".markdown-link-check.json"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check required files
        run: |
          set -euo pipefail
          for f in LICENSE CONTRIBUTING.md docs/VERIFICATION.md docs/PLUGIN.md docs/ROADMAP.md docs/PUBLISHING.md docs/DEPENDENCIES.md docs/EVAL_CI.md docs/EVAL_INVENTORY.md CHANGELOG.md .cursor-plugin/plugin.json .cursor-plugin/marketplace.json; do
            test -f "$f" || { echo "missing $f"; exit 1; }
          done

      - name: Check README sections
        run: |
          set -euo pipefail
          for section in Installation Architecture Evaluations Contributing; do
            grep -qiE "^##[[:space:]]+${section}" README.md || {
              echo "README.md missing section: $section"
              exit 1
            }
          done

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Forbid organization-specific trademarks
        run: python3 scripts/check_forbidden_org_strings.py

      - name: Check markdown links
        run: |
          set -euo pipefail
          npx --yes markdown-link-check@3.14.2 -c .markdown-link-check.json README.md CONTRIBUTING.md
          for f in .cursor/docs/*.md docs/*.md; do
            [[ -f "$f" ]] && npx --yes markdown-link-check@3.14.2 -c .markdown-link-check.json "$f"
          done
