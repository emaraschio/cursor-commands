name: Install smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - ".cursor/commands/**"
      - ".cursor/skill-contracts/**"
      - "scripts/install.sh"
      - "scripts/test_install.sh"
      - "scripts/validate-cursor-commands.py"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: install-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run install script
        env:
          CURSOR_HOME: ${{ runner.temp }}/cursor-home
        run: |
          set -euo pipefail
          chmod +x scripts/install.sh
          ./scripts/install.sh

      - name: Assert symlinks resolve
        env:
          CURSOR_HOME: ${{ runner.temp }}/cursor-home
        run: |
          set -euo pipefail
          test -f "$CURSOR_HOME/commands/code-review.md"
          test -f "$CURSOR_HOME/skill-contracts/merge-open-prs/SKILL.md"

      - name: Install merge mode tests
        run: |
          set -euo pipefail
          chmod +x scripts/test_install.sh
          ./scripts/test_install.sh
